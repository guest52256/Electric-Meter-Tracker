name: Android CI & Build (APKs & Bundle)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug/Release APKs & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore File
        run: |
          B64_DATA="${{ secrets.KEYSTORE_BASE64 }}"
          PATH_SECRET="${{ secrets.KEYSTORE_PATH }}"
          
          TARGET_PATH="my-upload-key.jks"
          
          # If KEYSTORE_PATH secret is provided, determine if it's a file path or direct Base64 content
          if [ ! -z "$PATH_SECRET" ]; then
            if [ ${#PATH_SECRET} -lt 100 ]; then
              TARGET_PATH="$PATH_SECRET"
            else
              if [ -z "$B64_DATA" ]; then
                B64_DATA="$PATH_SECRET"
              fi
            fi
          fi

          if [ ! -z "$B64_DATA" ]; then
            mkdir -p "$(dirname "$TARGET_PATH")"
            echo "$B64_DATA" | base64 --decode > "$TARGET_PATH"
            echo "Keystore successfully decoded to $TARGET_PATH"
          else
            echo "No base64 keystore data detected. Proceeding with default/checked-in keystore configurations."
          fi
        working-directory: ${{ github.workspace }}

      - name: Build Debug APK (assembleDebug)
        run: gradle assembleDebug

      - name: Build Release APK (assembleRelease)
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || 'my-upload-key.jks' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release App Bundle (bundleRelease)
        run: gradle bundleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || 'my-upload-key.jks' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
