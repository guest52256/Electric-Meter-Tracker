Name: Build and Release Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      # Decode your base64-encoded production keystore stored in repository secrets
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Release APK
        run: |
          EXPECTED_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$EXPECTED_APK" ] || [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Release APK not found."
            exit 1
          fi
          echo "FOUND_APK=$EXPECTED_APK" >> $GITHUB_ENV
          echo "Verified Release APK at $EXPECTED_APK"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.FOUND_APK }}
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME="${{ github.event.repository.name }}"
          SANITIZED_REPO_NAME=$(echo "$REPO_NAME" | sed -e 's/[^A-Za-z0-9._-]/_/g')
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-release-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"
          
          cp "${{ env.FOUND_APK }}" "$ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_filename=$ASSET_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish Release APK to GitHub Releases
        id: create-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_PATH="${{ steps.prepare-asset.outputs.asset_path }}"
          TAG="release-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Release APK Build #${{ github.run_number }}"
          NOTES="This is an automatically generated production release APK.
          
          Run Number: ${{ github.run_number }}
          Source Commit SHA: ${{ github.sha }}"
          
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest
            
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create-release.outcome }}" == "success" ]; then
            TAG="${{ steps.create-release.outputs.release_tag }}"
            FILENAME="${{ steps.prepare-asset.outputs.asset_filename }}"
            URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
            
            echo "### ✅ Release APK Published Successfully" >> $GITHUB_STEP_SUMMARY
            echo "**Release URL:** [Download $FILENAME]($URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Build Succeeded, Release Creation Failed" >> $GITHUB_STEP_SUMMARY
            echo "Download the APK directly from the **Artifacts** section of this run." >> $GITHUB_STEP_SUMMARY
          fi
          
