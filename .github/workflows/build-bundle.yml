name: Build Release AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -e
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_VERSION_STR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "ERROR: Could not detect Java version."
            exit 1
          fi
          JAVA_VER=$(echo "$JAVA_VERSION_STR" | cut -d'.' -f1)
          if [ "$JAVA_VER" = "1" ]; then
            JAVA_VER=$(echo "$JAVA_VERSION_STR" | cut -d'.' -f2)
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Java version $JAVA_VER is below 17."
            exit 1
          fi
          echo "Java version verified successfully."

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Verify Gradle version
        shell: bash
        run: |
          set -e

          GRADLE_VER=$(gradle --version | sed -nE 's/^Gradle ([0-9]+\.[0-9]+(\.[0-9]+)?).*$/\1/p' | head -n 1)

          echo "Detected Gradle version: $GRADLE_VER"

          if [ -z "$GRADLE_VER" ]; then
            echo "ERROR: Could not detect Gradle version."
            exit 1
          fi

          if [ "$GRADLE_VER" != "9.5.0" ]; then
            echo "ERROR: Gradle version is $GRADLE_VER, but exactly 9.5.0 is required."
            exit 1
          fi

          echo "Gradle 9.5.0 verified successfully."

      - name: Set up Debug Keystore
        shell: bash
        run: |
          set -e
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding existing debug.keystore.base64 from repository..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "No debug.keystore.base64 found in repository, generating a new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

      - name: Decode and setup keystore
        shell: bash
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_FILE_BASE64" ]; then
            echo "ERROR: KEYSTORE_FILE_BASE64 secret is missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/Kinza KeyStore.p12"

          echo "$KEYSTORE_FILE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "ERROR: Failed to create the PKCS12 keystore file."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded PKCS12 keystore is empty."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "PKCS12 keystore prepared successfully in temporary runner storage."

      - name: Verify signing configuration
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PATH" ]; then
            echo "ERROR: KEYSTORE_PATH was not initialized."
            exit 1
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: Decoded keystore file does not exist."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Decoded keystore file is empty."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing configuration verified successfully."

      - name: Build Release AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          gradle :app:bundleRelease --stacktrace --no-daemon \
            -PKEYSTORE_PATH="$KEYSTORE_PATH" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Generate Dynamic Release Info
        shell: bash
        run: |
          set -e
          DATETIME=$(TZ="Asia/Karachi" date +'%d-%m-%Y %I-%M %p')
          VERSION="v1.0.0"
          
          # Extract repo name from repository path e.g. "user/Electric-Meter-Tracker" -> "Electric-Meter-Tracker"
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          # Replace hyphens and underscores with spaces to format nicely as an app name
          APP_NAME=$(echo "$REPO_NAME" | tr '_-' ' ')
          
          TYPE="Release AAB"
          
          # Construct file name and release name
          FILE_NAME="$APP_NAME $TYPE $VERSION $DATETIME"
          
          # Construct sanitized tag name (replace spaces and colons with hyphens)
          TAG_NAME=$(echo "$FILE_NAME" | tr ' :' '--' | tr -s '-')
          
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$FILE_NAME" >> "$GITHUB_ENV"

      - name: Verify and Format Release AAB Output
        shell: bash
        run: |
          set -e
          ORIG_AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$ORIG_AAB_PATH" ] && [ -s "$ORIG_AAB_PATH" ]; then
            echo "SUCCESS: Release AAB found at $ORIG_AAB_PATH"
          else
            echo "ERROR: Expected Release AAB not found or is empty at $ORIG_AAB_PATH."
            echo "Searching only inside app/build/outputs/bundle..."
            if [ -d "app/build/outputs/bundle" ]; then
              find app/build/outputs/bundle -type f -name "*.aab"
              FOUND_AAB=$(find app/build/outputs/bundle -type f -name "app-release.aab" -size +0c | head -n 1)
              if [ -n "$FOUND_AAB" ]; then
                echo "Found release AAB at $FOUND_AAB"
                cp "$FOUND_AAB" "$ORIG_AAB_PATH"
              else
                exit 1
              fi
            else
              exit 1
            fi
          fi
          
          # Copy to final formatted path inside runner temp
          FINAL_AAB="$RUNNER_TEMP/${{ env.FILE_NAME }}.aab"
          cp "$ORIG_AAB_PATH" "$FINAL_AAB"
          echo "FINAL_AAB_PATH=$FINAL_AAB" >> "$GITHUB_ENV"
          echo "Prepared dynamic release AAB at $FINAL_AAB"

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ env.FINAL_AAB_PATH }}
          if-no-files-found: error

      - name: Upload Release AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_AAB_PATH }}
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: "Automated Release AAB build."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
