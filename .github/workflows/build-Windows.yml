name: Build Kotlin Windows Desktop App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build Windows Distribution
        run: gradle :composeApp:packageDistributionForCurrentOS --stacktrace

      - name: Locate and Package Artifacts
        shell: powershell
        run: |
          # Finds the compiled .exe or MSI installer generated by JetBrains Compose
          $BuildDir = "composeApp\build\compose\binaries\main"
          if (Test-Path $BuildDir) {
              Compress-Archive -Path "$BuildDir\*" -DestinationPath "Electric-Meter-Tracker-Windows.zip" -Force
          } else {
              Write-Error "Build output directory not found!"
              exit 1
          }

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Electric-Meter-Tracker-Desktop
          path: Electric-Meter-Tracker-Windows.zip
