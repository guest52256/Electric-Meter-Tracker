name: Build Release App Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release-bundle:
    name: Build Signed App Bundle (bundleRelease)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore / Setup Key File
        run: |
          B64_DATA="${{ secrets.KEYSTORE_BASE64 }}"
          PATH_SECRET="${{ secrets.KEYSTORE_PATH }}"
          
          TARGET_PATH="my-upload-key.jks"
          
          if [ ! -z "$PATH_SECRET" ]; then
            if [ ${#PATH_SECRET} -lt 100 ]; then
              TARGET_PATH="$PATH_SECRET"
            else
              if [ -z "$B64_DATA" ]; then
                B64_DATA="$PATH_SECRET"
              fi
            fi
          fi

          if [ ! -z "$B64_DATA" ]; then
            mkdir -p "$(dirname "$TARGET_PATH")"
            echo "$B64_DATA" | base64 --decode > "$TARGET_PATH"
            echo "Keystore successfully decoded to $TARGET_PATH"
          else
            echo "No base64 keystore data detected. Proceeding with KEYSTORE_PATH."
          fi
        working-directory: ${{ github.workspace }}

      - name: Build Release App Bundle
        run: gradle bundleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || 'my-upload-key.jks' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
